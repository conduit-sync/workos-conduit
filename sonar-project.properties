sonar.projectKey=conduit-sync_workos-conduit
sonar.projectName=WorkOS Conduit
sonar.organization=conduit-sync
sonar.projectVersion=1.0.0
sonar.sources=src
sonar.tests=tests
sonar.language=py
sonar.sourceEncoding=UTF-8

# Python-specific
sonar.python.version=3.13
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml

# Exclusions
sonar.exclusions=**/__pycache__/**,**/*.pyc,infra/**,scripts/**,src/api/router.py

# Quality gate
sonar.qualitygate.wait=true

# Coverage thresholds enforced by quality gate in SonarQube UI
# Recommended minimums: line coverage 80%, branch coverage 70%
