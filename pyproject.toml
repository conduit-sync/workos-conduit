[project]
name = "workos-conduit"
version = "1.0.0"
description = "Generic user provisioning bridge: WorkOS → third-party targets"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.13"
readme = "README.md"

dependencies = [
    "workos>=5.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.5.0",
    "structlog>=24.0.0",
    "boto3>=1.35.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "moto[s3,ssm]>=5.0.0",
    "black>=24.0.0",
    "ruff>=0.6.0",
]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=xml --cov-report=term-missing -v"

[tool.coverage.run]
omit = ["src/api/router.py"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
